openapi: 3.0.3
info:
  title: TourismInfo API
  version: 1.0.0
  description: "This is tourism info api description file, use [Open Data](https://data.gov.tw/) provide data.  \n
  [restaurant](https://data.gov.tw/dataset/7779)  \n
  [scenic spot](https://data.gov.tw/dataset/7777)  \n
  [hotel](https://data.gov.tw/dataset/7780)"

tags:
  - name: Food
    description: Restaurant and dining information
  - name: TouristSpots
    description: Scenic spots and attractions
  - name: Hotels
    description: Accommodation and hotel information

paths:
  '/food-info/{region}/{town}':
    get:
      tags: [Food]
      summary: Get Food Info
      operationId: getFoodInfo
      parameters:
        - $ref: '#/components/parameters/RegionParam'
        - $ref: '#/components/parameters/TownParam'
      responses:
        '200':
          description: Successfully retrieved food information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodResponse'
              examples:
                Response:
                  value:
                    status: 200
                    message: ''
                    data:
                      - Id: 1
                        Add: "123 Restaurant St, Taipei City"
                        Tel: "886-2-12345678"
                        OpenTime: "08:00-22:00"
                        Website: "https://example.com"
                        Description: "A famous local restaurant."
                        Pictures: ["https://example.com/pic1.jpg"]
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  '/tourist-spots/{region}/{town}':
    get:
      tags: [TouristSpots]
      summary: Get Tourist Spots
      operationId: getTouristSpots
      parameters:
        - $ref: '#/components/parameters/RegionParam'
        - $ref: '#/components/parameters/TownParam'
      responses:
        '200':
          description: Successfully retrieved tourist spots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TouristSpotResponse'
              examples:
                Response:
                  value:
                    status: 200
                    message: ''
                    data:
                      - Id: 1
                        Add: "Scenic Mountain Road"
                        Name: "Example National Park"
                        Tel: "886-3-9876543"
                        OpenTime: "09:00-18:00"
                        TicketInfo: "Adult: $100"
                        TravellingInfo: "Take bus 501"
                        Website: "https://park.example.com"
                        Description: "Beautiful mountain views."
                        Pictures: ["https://example.com/spot1.jpg"]
                        ChangeTime: "2026-05-05"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  '/hotel-info/{region}/{town}':
    get:
      tags: [Hotels]
      summary: Get Hotel Info
      operationId: getHotelInfo
      parameters:
        - $ref: '#/components/parameters/RegionParam'
        - $ref: '#/components/parameters/TownParam'
      responses:
        '200':
          description: Successfully retrieved hotel information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelResponse'
              examples:
                Response:
                  value:
                    status: 200
                    message: ''
                    data:
                      - Id: "H001"
                        Add: "456 Hotel Ave, Kaohsiung"
                        Name: "Grand Plaza Hotel"
                        Tel: "886-7-1112223"
                        Website: "https://hotel.example.com"
                        ServiceInfo: ["WiFi", "Pool", "Breakfast"]
                        Description: "Luxury stay in the heart of the city."
                        Pictures: ["https://example.com/hotel1.jpg"]
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    RegionParam:
      name: region
      in: path
      required: true
      schema:
        type: string
        example: 新北市
      description: The administrative region
    TownParam:
      name: town
      in: path
      required: true
      schema:
        type: string
        example: 板橋區
      description: The specific town or district

  schemas:
    # Common Error Structure
    ErrorResponse:
      type: object
      required: [status, message]
      properties:
        status: { type: integer, example: 500 }
        message: { type: string, example: "Internal server error." }

    # Food Schema
    FoodResponse:
      type: object
      required: [status, message, data]
      properties:
        status: { type: integer, example: 200 }
        message: { type: string }
        data:
          type: array
          items:
            type: object
            required: [Id, Add, Tel, OpenTime, Website, Description, Pictures]
            properties:
              Id: { type: integer }
              Add: { type: string }
              Tel: { type: string }
              OpenTime: { type: string }
              Website: { type: string }
              Description: { type: string }
              Pictures: { type: array, items: { type: string } }

    # Tourist Spot Schema
    TouristSpotResponse:
      type: object
      required: [status, message, data]
      properties:
        status: { type: integer, example: 200 }
        message: { type: string }
        data:
          type: array
          items:
            type: object
            required: [Id, Add, Name, Tel, OpenTime, TicketInfo, TravellingInfo, Website, Description, Pictures, ChangeTime]
            properties:
              Id: { type: integer }
              Add: { type: string }
              Name: { type: string }
              Tel: { type: string }
              OpenTime: { type: string }
              TicketInfo: { type: string }
              TravellingInfo: { type: string }
              Website: { type: string }
              Description: { type: string }
              Pictures: { type: array, items: { type: string } }
              ChangeTime: { type: string }

    # Hotel Schema
    HotelResponse:
      type: object
      required: [status, message, data]
      properties:
        status: { type: integer, example: 200 }
        message: { type: string }
        data:
          type: array
          items:
            type: object
            required: [Id, Add, Name, Tel, Website, ServiceInfo, Description, Pictures]
            properties:
              Id: { type: string }
              Add: { type: string }
              Name: { type: string }
              Tel: { type: string }
              Website: { type: string }
              ServiceInfo: { type: array, items: { type: string } }
              Description: { type: string }
              Pictures: { type: array, items: { type: string } }